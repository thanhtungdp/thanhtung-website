<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1792px; height: 1024px;
  background: linear-gradient(180deg, #F6F1E8 0%, #EDE5D8 60%, #E8DFD0 100%);
  font-family: 'Inter', 'Georgia', serif;
  overflow: hidden;
  position: relative;
}
.grid {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, #D8CFBE 1.2px, transparent 1.2px);
  background-size: 32px 32px;
}
.title {
  position: absolute;
  top: 50px; left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 6px;
  color: #14120F;
  text-transform: uppercase;
}
.title-line {
  position: absolute;
  top: 90px; left: 50%;
  transform: translateX(-50%);
  width: 80px; height: 3px;
  background: #F86000;
  border-radius: 2px;
}
.foundation {
  position: absolute;
  bottom: 80px; left: 80px; right: 80px;
  height: 8px;
  background: linear-gradient(180deg, #14120F, #2a2620);
  border-radius: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.foundation-glow {
  position: absolute;
  bottom: 72px; left: 80px; right: 80px;
  height: 20px;
  background: linear-gradient(to top, rgba(248,96,0,0.25), transparent);
  border-radius: 4px;
}
.steps-row {
  position: absolute;
  bottom: 100px; left: 100px; right: 100px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.step {
  flex: 1;
  position: relative;
}
.step-body {
  width: 100%;
  border-radius: 8px 8px 0 0;
  position: relative;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.step-1 .step-body { height: 90px; background: linear-gradient(180deg, #1a1815, #14120F); }
.step-2 .step-body { height: 170px; background: linear-gradient(180deg, #201e1a, #1a1815); }
.step-3 .step-body { height: 250px; background: linear-gradient(180deg, #262420, #201e1a); }
.step-4 .step-body { height: 330px; background: linear-gradient(180deg, #2c2a25, #262420); }
.step-5 .step-body { height: 410px; background: linear-gradient(180deg, #322f2a, #2c2a25); }
.step-6 .step-body { height: 490px; background: linear-gradient(180deg, #383530, #322f2a); }

.step-cap {
  position: absolute;
  top: -28px; left: -8px; right: -8px;
  height: 34px;
  background: linear-gradient(180deg, #F86000, #E05500);
  border-radius: 6px 6px 0 0;
  box-shadow: 0 4px 12px rgba(248,96,0,0.3);
}
.step-label {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  color: #F6F1E8;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  white-space: nowrap;
}
.step-num {
  position: absolute;
  top: -52px; left: 50%;
  transform: translateX(-50%);
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #F86000, #E05500);
  border-radius: 50%;
  color: #fff;
  font-size: 22px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  box-shadow: 0 6px 20px rgba(248,96,0,0.45);
}
.door-frame {
  position: absolute;
  top: 80px; right: 120px;
  width: 150px; height: 260px;
  background: linear-gradient(180deg, #1a1815, #14120F);
  border-radius: 8px 8px 0 0;
  box-shadow: 0 0 80px rgba(248,96,0,0.2), 0 8px 24px rgba(0,0,0,0.2);
}
.door-inner {
  position: absolute;
  inset: 10px;
  background: linear-gradient(180deg, #F6F1E8, #EDE5D8);
  border-radius: 4px 4px 0 0;
  box-shadow: inset 0 0 40px rgba(248,96,0,0.08);
}
.door-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(248,96,0,0.12) 0%, transparent 70%);
  border-radius: 50%;
}
.connector {
  position: absolute;
  top: 210px; right: 270px;
  width: 180px; height: 3px;
  background: linear-gradient(90deg, rgba(248,96,0,0.6), #F86000);
  transform: rotate(-12deg);
  transform-origin: left center;
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(248,96,0,0.3);
}
.connector-dot {
  position: absolute;
  top: 207px; right: 265px;
  width: 10px; height: 10px;
  background: #F86000;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(248,96,0,0.5);
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="title">6 STEPS TO FREEDOM</div>
<div class="title-line"></div>

<div class="foundation"></div>
<div class="foundation-glow"></div>

<div class="steps-row">
  <div class="step step-1">
    <div class="step-num">1</div>
    <div class="step-body">
      <div class="step-cap"></div>
      <div class="step-label">MASTERY</div>
    </div>
  </div>
  <div class="step step-2">
    <div class="step-num">2</div>
    <div class="step-body">
      <div class="step-cap"></div>
      <div class="step-label">MARKETING</div>
    </div>
  </div>
  <div class="step step-3">
    <div class="step-num">3</div>
    <div class="step-body">
      <div class="step-cap"></div>
      <div class="step-label">SYSTEMS</div>
    </div>
  </div>
  <div class="step step-4">
    <div class="step-num">4</div>
    <div class="step-body">
      <div class="step-cap"></div>
      <div class="step-label">TEAM</div>
    </div>
  </div>
  <div class="step step-5">
    <div class="step-num">5</div>
    <div class="step-body">
      <div class="step-cap"></div>
      <div class="step-label">SCALE</div>
    </div>
  </div>
  <div class="step step-6">
    <div class="step-num">6</div>
    <div class="step-body">
      <div class="step-cap"></div>
      <div class="step-label">FREEDOM</div>
    </div>
  </div>
</div>

<div class="door-frame">
  <div class="door-inner"></div>
</div>
<div class="door-glow"></div>
<div class="connector"></div>
<div class="connector-dot"></div>
</body>
</html>
